[project]
name = "mika"
version = "0.1.1"
description = "AI-powered MikroTik RouterOS assistant - Natural language CLI for configuration, troubleshooting, and monitoring."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "questionary>=2.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "librouteros>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mika = "mika.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mika"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
